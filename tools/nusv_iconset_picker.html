<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nusvanir IconSet Picker (Tales of The Dark Time)</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --accent: #f59e0b;
    --text: #c9d1d9;
    --text-bright: #ffffff;
    --highlight: rgba(245, 158, 11, 0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    display: flex;
    gap: 20px;
    height: 100vh;
    overflow: hidden;
  }
  .main-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  h1 {
    font-size: 22px;
    color: var(--text-bright);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .badge {
    font-size: 12px;
    background: var(--accent);
    color: #000;
    padding: 3px 8px;
    border-radius: 999px;
    font-weight: 700;
  }
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    background: var(--panel);
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  input[type="text"] {
    flex: 1;
    padding: 8px 12px;
    background: #090d13;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
  }
  .grid-wrap {
    flex: 1;
    overflow-y: auto;
    background: #090d13;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .icon-grid {
    display: grid;
    grid-template-columns: repeat(16, 36px);
    gap: 2px;
    width: max-content;
    margin: 0 auto;
    background: #10141c;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #21262d;
  }
  .cell {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 4px;
    cursor: pointer;
    position: relative;
    transition: transform 0.1s, border-color 0.1s;
  }
  .cell:hover {
    transform: scale(1.15);
    border-color: var(--accent);
    z-index: 10;
    box-shadow: 0 0 8px var(--accent);
  }
  .cell.active {
    border-color: #38bdf8;
    background: rgba(56, 189, 248, 0.2);
    box-shadow: 0 0 10px #38bdf8;
  }
  .cell.match {
    background: rgba(245, 158, 11, 0.2);
    border-color: var(--accent);
  }
  .icon-sprite {
    width: 32px;
    height: 32px;
    background-image: url('../img/system/IconSet.png');
    background-repeat: no-repeat;
    image-rendering: pixelated;
  }

  /* Sidebar */
  .sidebar {
    width: 320px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    text-align: center;
  }
  .big-preview-box {
    width: 140px;
    height: 140px;
    background: #090d13;
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .big-sprite {
    width: 96px;
    height: 96px;
    background-image: url('../img/system/IconSet.png');
    background-repeat: no-repeat;
    image-rendering: pixelated;
    background-size: 1536px auto; /* 512 * 3 = 1536 */
  }
  .detail-card {
    width: 100%;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 12px;
    text-align: left;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .btn-copy {
    width: 100%;
    background: var(--accent);
    color: #000;
    font-weight: 700;
    border: none;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: opacity 0.15s;
  }
  .btn-copy:hover { opacity: 0.9; }
</style>
</head>
<body>

<div class="main-col">
  <header>
    <h1>Nusvanir IconSet Picker <span class="badge">1,392 Ikon</span></h1>
    <div style="font-size: 13px; color: var(--text);">
      Klik ikon mana saja pada grid di bawah untuk menyalin nomor <b>iconIndex</b> ke database game Anda.
    </div>
    <div class="controls">
      <input type="text" id="filterInput" placeholder="Cari nama ikon (misal: katana, potion, poison, shield, flame, dragon)...">
      <div id="matchCount" style="font-size: 13px; color: var(--accent);">1,392 ikon</div>
    </div>
  </header>

  <div class="grid-wrap">
    <div class="icon-grid" id="iconGrid"></div>
  </div>
</div>

<div class="sidebar">
  <h2 style="font-size: 16px; color: #fff;">Detail Ikon Terpilih</h2>
  <div class="big-preview-box">
    <div class="big-sprite" id="bigSprite"></div>
  </div>

  <div class="detail-card">
    <div>Nama: <b id="dName" style="color: #fff;">-</b></div>
    <div>Index: <b id="dIndex" style="color: var(--accent); font-size: 16px;">0</b></div>
    <div>Kategori: <b id="dCat" style="color: #38bdf8;">-</b></div>
    <div>Grid: <span id="dGrid">Row 0, Col 0</span></div>
  </div>

  <button class="btn-copy" id="btnCopy" onclick="copyIndex()">Salin iconIndex (0)</button>
  <div id="copyNotice" style="font-size: 12px; color: #4ade80; display: none;">Tersalin ke clipboard!</div>
</div>

const iconGrid = document.getElementById('iconGrid');
const filterInput = document.getElementById('filterInput');
const matchCount = document.getElementById('matchCount');

const bigSprite = document.getElementById('bigSprite');
const dName = document.getElementById('dName');
const dIndex = document.getElementById('dIndex');
const dCat = document.getElementById('dCat');
const dGrid = document.getElementById('dGrid');
const btnCopy = document.getElementById('btnCopy');
const copyNotice = document.getElementById('copyNotice');

let selectedIndex = 0;

function renderGrid() {
  let html = '';
  MAPPING.forEach(item => {
    const x = -(item.col * 32);
    const y = -(item.row * 32);
    html += `
      <div class="cell ${item.index === 0 ? 'active' : ''}" data-idx="${item.index}" title="#${item.index} - ${item.name} (${item.category})">
        <div class="icon-sprite" style="background-position: ${x}px ${y}px;"></div>
      </div>
    `;
  });
  iconGrid.innerHTML = html;
}

iconGrid.addEventListener('click', (e) => {
  const cell = e.target.closest('.cell');
  if (!cell) return;
  const idx = parseInt(cell.dataset.idx, 10);
  selectIcon(idx);
});

function selectIcon(idx) {
  selectedIndex = idx;
  const item = MAPPING[idx];
  if (!item) return;

  document.querySelectorAll('.cell').forEach(c => c.classList.remove('active'));
  const activeCell = document.querySelector(`.cell[data-idx="${idx}"]`);
  if (activeCell) activeCell.classList.add('active');

  dName.textContent = item.name;
  dIndex.textContent = item.index;
  dCat.textContent = item.category;
  dGrid.textContent = `Baris ${item.row}, Kolom ${item.col}`;
  btnCopy.textContent = `Salin iconIndex (${item.index})`;

  // Update big preview (3x scale)
  const bigX = -(item.col * 96);
  const bigY = -(item.row * 96);
  bigSprite.style.backgroundPosition = `${bigX}px ${bigY}px`;
}

function copyIndex() {
  navigator.clipboard.writeText(String(selectedIndex)).then(() => {
    copyNotice.style.display = 'block';
    setTimeout(() => { copyNotice.style.display = 'none'; }, 1500);
  });
}

filterInput.addEventListener('input', () => {
  const query = filterInput.value.trim().toLowerCase();
  let matches = 0;
  let firstMatch = -1;

  document.querySelectorAll('.cell').forEach(cell => {
    const idx = parseInt(cell.dataset.idx, 10);
    const item = MAPPING[idx];
    const match = !query || item.name.toLowerCase().includes(query) || item.category.toLowerCase().includes(query) || String(idx) === query;

    if (match && query) {
      cell.classList.add('match');
      matches++;
      if (firstMatch === -1) firstMatch = idx;
    } else {
      cell.classList.remove('match');
      if (!query) matches++;
    }
  });

  matchCount.textContent = `${matches.toLocaleString()} cocok`;
  if (firstMatch !== -1) {
    selectIcon(firstMatch);
    const targetCell = document.querySelector(`.cell[data-idx="${firstMatch}"]`);
    if (targetCell) targetCell.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
});

renderGrid();
selectIcon(1);
</script>
